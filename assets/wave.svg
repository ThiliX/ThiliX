<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" preserveAspectRatio="none">
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fc3f3f"/>
      <stop offset="0.5" stop-color="#ff6b4a"/>
      <stop offset="1" stop-color="#fc3f3f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fc3f3f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fc3f3f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .w{animation:slide linear infinite}
    .back{animation-duration:14s}
    .mid{animation-duration:9s;animation-direction:reverse}
    .front{animation-duration:6s}
    @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-600px)}}
    @media (prefers-reduced-motion:reduce){.w{animation:none}}
  </style>
  <rect x="0" y="40" width="1200" height="100" fill="url(#glow)"/>
  <g class="w back"><path fill="#4a0a14" d="M0 62 Q150 30 300 62 T600 62 T900 62 T1200 62 T1500 62 T1800 62 V140 H0Z"/></g>
  <g class="w mid"><path fill="#b3122a" opacity="0.9" d="M0 82 Q150 54 300 82 T600 82 T900 82 T1200 82 T1500 82 T1800 82 V140 H0Z"/></g>
  <g class="w front"><path fill="url(#front)" d="M0 102 Q150 78 300 102 T600 102 T900 102 T1200 102 T1500 102 T1800 102 V140 H0Z"/></g>
</svg>
