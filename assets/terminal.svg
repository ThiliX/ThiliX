<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-label="Terminal: whoami Thilina Niroshan Wickramanayake. Pipeline: Code passed, Package passed, Ship passed, Learning running.">
  <style>
    text{font-family:"JetBrains Mono","Fira Code",Consolas,"SFMono-Regular",Menlo,monospace;font-size:14px}
    .u{fill:#fc3f3f}.h{fill:#7ee787}.w{fill:#d6d6dc}.c{fill:#6e7681}
    .ok{fill:#3fb950;font-weight:700;font-size:13px}.run{fill:#fc3f3f;font-weight:700;font-size:13px}
    .n{fill:#f0f6fc;font-weight:700;font-size:15px}.t{fill:#8b949e;font-size:12px}
    .pulse{animation:pulse 1.4s ease-in-out infinite}
    .scan{animation:scan 2.4s ease-in-out infinite alternate}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    @keyframes scan{from{transform:translateX(0)}to{transform:translateX(150px)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.pulse,.scan,.blink{animation:none}}
  </style>
  <defs>
    <clipPath id="win"><rect width="840" height="300" rx="10"/></clipPath>
    <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#fc3f3f" stop-opacity="0"/><stop offset=".5" stop-color="#fc3f3f"/><stop offset="1" stop-color="#fc3f3f" stop-opacity="0"/></linearGradient>
  </defs>
  <g clip-path="url(#win)">
    <rect width="840" height="300" fill="#0c0c0e"/>
    <rect width="840" height="34" fill="#202026"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
    <text x="420" y="22" text-anchor="middle" class="t">thilix@github: ~/career-pipeline · main</text>

    <text x="20" y="64"><tspan class="u">thilix</tspan><tspan class="h">@github</tspan><tspan class="w">:~$ whoami</tspan></text>
    <text x="20" y="86" class="w">Thilina Niroshan Wickramanayake</text>
    <text x="20" y="108" class="c"># Sri Lanka · BSc Software Engineering @ NSBM Green University (2028)</text>

    <text x="20" y="144"><tspan class="u">thilix</tspan><tspan class="h">@github</tspan><tspan class="w">:~$ ./pipeline --status</tspan></text>

    <g transform="translate(20 158)">
      <rect width="800" height="80" fill="#161b22" stroke="#30363d"/>
      <line x1="200" y1="0" x2="200" y2="80" stroke="#30363d"/><line x1="400" y1="0" x2="400" y2="80" stroke="#30363d"/><line x1="600" y1="0" x2="600" y2="80" stroke="#30363d"/>
      <g transform="translate(14 0)"><text y="24" class="ok">✓ passed</text><text y="46" class="n">Code</text><text y="66" class="t">Java · C# · Python · TS</text></g>
      <g transform="translate(214 0)"><text y="24" class="ok">✓ passed</text><text y="46" class="n">Package</text><text y="66" class="t">Docker · Compose</text></g>
      <g transform="translate(414 0)"><text y="24" class="ok">✓ passed</text><text y="46" class="n">Ship</text><text y="66" class="t">Kubernetes · Actions</text></g>
      <g transform="translate(614 0)"><circle cx="5" cy="19.5" r="4.5" fill="#fc3f3f" class="pulse"/><text x="16" y="24" class="run">running</text><text y="46" class="n">Learning</text><text y="66" class="t">Azure · Spring Boot</text></g>
      <rect x="600" y="77" width="200" height="3" fill="#3a1416"/>
      <rect x="600" y="77" width="50" height="3" fill="url(#beam)" class="scan"/>
    </g>

    <text x="20" y="278"><tspan class="u">thilix</tspan><tspan class="h">@github</tspan><tspan class="w">:~$ kubectl get deployments</tspan><tspan class="c">  # expand a row below</tspan></text>
  </g>
</svg>
